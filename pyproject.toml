[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "data-mask-studio"
version = "0.7.0"
description = "Aplicação desktop local para anonimização reversível de dados CSV."
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7,<7",
    "cryptography>=45,<47",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "PyInstaller>=6.11,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
