name: Testes

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Preparar diretório local isolado
        shell: pwsh
        run: |
          $isolatedPath = Join-Path $env:RUNNER_TEMP "DataMaskStudio-CI"
          New-Item -ItemType Directory -Force -Path $isolatedPath | Out-Null
          "LOCALAPPDATA=$isolatedPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Instalar o projeto e dependências de desenvolvimento
        run: python -m pip install -e ".[dev]"

      - name: Executar a suíte de testes
        shell: pwsh
        run: python -m pytest --basetemp (Join-Path $env:RUNNER_TEMP "data-mask-studio-pytest")
