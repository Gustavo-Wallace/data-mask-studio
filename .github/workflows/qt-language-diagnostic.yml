{
  "name": "Windows Qt language-save diagnostics (shard 1 only)",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "context_run_id": {
          "description": "Required Actions run ID of pilot #2, containing artifact p03-shard-1",
          "type": "string",
          "required": true
        }
      }
    }
  },
  "permissions": {"contents": "read", "actions": "read"},
  "jobs": {
    "diagnostic": {
      "name": "Original shard 1 with dialog provenance and language observations",
      "runs-on": "windows-latest",
      "timeout-minutes": 45,
      "env": {"QT_QPA_PLATFORM": "offscreen"},
      "steps": [
        {"uses": "actions/checkout@v4"},
        {
          "name": "Isolate synthetic application and temporary directories",
          "shell": "pwsh",
          "run": "$root = Join-Path $env:RUNNER_TEMP \"dms-p0313-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT\"\n$local = Join-Path $root 'localappdata'\n$temp = Join-Path $root 'temp'\nNew-Item -ItemType Directory -Force -Path $local,$temp | Out-Null\n@(\"DMS_QT_DIAGNOSTIC_ROOT=$root\", \"LOCALAPPDATA=$local\", \"TEMP=$temp\", \"TMP=$temp\") | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append"
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {"python-version": "3.12", "cache": "pip", "cache-dependency-path": "pyproject.toml"}
        },
        {"name": "Install unchanged development dependencies", "run": "python -m pip install -e \".[dev]\""},
        {
          "name": "Download only the original shard 1 context",
          "uses": "actions/download-artifact@v4",
          "with": {
            "name": "p03-shard-1",
            "path": "${{ env.DMS_QT_DIAGNOSTIC_ROOT }}/context",
            "run-id": "${{ inputs.context_run_id }}",
            "github-token": "${{ github.token }}"
          }
        },
        {
          "name": "Replay original module order once, without changing assertions",
          "shell": "pwsh",
          "run": "python scripts/ci_qt_language_diagnostic.py --context-manifest (Join-Path $env:DMS_QT_DIAGNOSTIC_ROOT 'context/manifest.json') --output-dir (Join-Path $env:DMS_QT_DIAGNOSTIC_ROOT 'reports') --basetemp (Join-Path $env:DMS_QT_DIAGNOSTIC_ROOT 'pytest')\nexit $LASTEXITCODE"
        },
        {
          "name": "Retain only read-only observations and pytest reports",
          "if": "${{ always() && env.DMS_QT_DIAGNOSTIC_ROOT != '' }}",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "p0313-language-save-diagnostics",
            "path": "${{ env.DMS_QT_DIAGNOSTIC_ROOT }}/reports/",
            "if-no-files-found": "warn",
            "overwrite": true,
            "retention-days": 14
          }
        }
      ]
    }
  }
}
